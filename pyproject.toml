[project]
name = "finance-close-toolkit"
version = "0.1.0"
description = "APAC regional close: country submissions to a reconciled, versioned regional release."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fct = "finance_close_toolkit.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
